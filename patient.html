<!DOCTYPE html>
<html>
<head>
  <title>Patient Detail</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <a href="index.html">&larr; Back to list</a>
  <h1 id="patientName">Loading...</h1>
  <p id="patientInfo"></p>

  <div id="slotsContainer"></div>

  <hr>
  <h3>Discharge</h3>
  <button onclick="triggerCapture('Discharge Photo')">Capture Discharge Photo</button>
  <p id="dischargeStatus"></p>

  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
  <p id="uploadStatus" style="font-weight:bold;"></p>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const mrd = params.get('mrd');
    let currentUserEmail = "";
    let activeSlotType = "";
    let patientCategory = "";
    const today = new Date().toISOString().split('T')[0];

    const GEOTAG_SLOTS = ["Patient Photo", "Before Procedure", "During Procedure", "After Procedure", "Discharge Photo"];

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "index.html";
        return;
      }
      currentUserEmail = sessionData.session.user.email;

      const { data: patient, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .eq('mrd', mrd)
        .single();

      if (error || !patient) {
        document.getElementById('patientName').innerText = "Patient not found";
        return;
      }

      document.getElementById('patientName').innerText = patient.name;
      document.getElementById('patientInfo').innerText =
        `MRD: ${patient.mrd} | Ward: ${patient.ward} | Bed: ${patient.bed_no} | Category: ${patient.patient_category}`;
      patientCategory = patient.patient_category;

      if (patient.is_discharged) {
        document.getElementById('dischargeStatus').innerText = "Patient already discharged on " + patient.discharged_date;
      }

      renderSlots();
      loadTodayStatus();
    }

    function renderSlots() {
      let slotTypes = [];
      if (patientCategory === "Medicine") {
        slotTypes = ["Patient Photo", "IPD Chart", "Drug Chart", "TPRB Chart", "Extra1", "Extra2"];
      } else {
        slotTypes = ["Before Procedure", "During Procedure", "After Procedure", "Extra1", "Extra2"];
      }

      const container = document.getElementById('slotsContainer');
      container.innerHTML = slotTypes.map(type => `
        <div id="slot-${type}" style="border:1px solid #ccc; padding:10px; margin:8px 0;">
          <strong>${type}</strong>
          <span id="status-${type}"> — Not captured</span><br>
          <button onclick="triggerCapture('${type}')">Capture</button>
        </div>
      `).join('');
    }

    async function loadTodayStatus() {
      const { data, error } = await supabaseClient
        .from('daily_photos')
        .select('*')
        .eq('mrd', mrd)
        .eq('photo_date', today);

      if (!error && data) {
        data.forEach(entry => {
          const statusEl = document.getElementById('status-' + entry.photo_type);
          if (statusEl) {
            statusEl.innerText = " — Captured by " + entry.uploaded_by;
          }
          if (entry.photo_type === "Discharge Photo") {
            document.getElementById('dischargeStatus').innerText = "Captured by " + entry.uploaded_by;
          }
        });
      }
    }

    function triggerCapture(slotType) {
      activeSlotType = slotType;
      document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('uploadStatus');
      const needsGeotag = GEOTAG_SLOTS.includes(activeSlotType);

      let lat = null, lon = null, geoStoreText = "";
      let pdfBlob;

      if (needsGeotag) {
        statusEl.innerText = "Getting location...";
        const loc = await getLocation();
        lat = loc.lat;
        lon = loc.lon;
        geoStoreText = loc.text;

        let address = null;
        let mapDataUrl = null;

        if (lat !== null && lon !== null) {
          statusEl.innerText = "Fetching address...";
          address = await getAddress(lat, lon);
          statusEl.innerText = "Fetching map...";
          mapDataUrl = await getMapThumbnail(lat, lon);
        }

        statusEl.innerText = "Preparing document...";
        pdfBlob = await buildGeotaggedPdf(file, lat, lon, address, mapDataUrl, 1280, 0.7);
      } else {
        statusEl.innerText = "Preparing document...";
        pdfBlob = await buildDocumentPdf(file, 1280, 0.75);
      }

      statusEl.innerText = "Uploading, please wait...";

      const filePath = `${mrd}/${today}/${activeSlotType}-${Date.now()}.pdf`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('patient-photos')
        .upload(filePath, pdfBlob);

      if (uploadError) {
        statusEl.innerText = "";
        alert("Upload failed: " + uploadError.message);
        return;
      }

      const { error: insertError } = await supabaseClient
        .from('daily_photos')
        .insert([{
          mrd: mrd,
          photo_date: today,
          photo_type: activeSlotType,
          photo_url: filePath,
          file_type: "pdf",
          geo_location: geoStoreText,
          uploaded_by: currentUserEmail
        }]);

      if (insertError) {
        statusEl.innerText = "";
        alert("Save failed: " + insertError.message);
        return;
      }

      if (activeSlotType === "Discharge Photo") {
        await supabaseClient
          .from('Patients')
          .update({ is_discharged: true, discharged_date: today })
          .eq('mrd', mrd);
        document.getElementById('dischargeStatus').innerText = "Captured by " + currentUserEmail;
      } else {
        const slotStatusEl = document.getElementById('status-' + activeSlotType);
        if (slotStatusEl) slotStatusEl.innerText = " — Captured by " + currentUserEmail;
      }

      statusEl.innerText = "";
      alert(activeSlotType + " saved successfully!");
      e.target.value = "";
    });

    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: null, lon: null, text: "Location not supported" });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            text: pos.coords.latitude + "," + pos.coords.longitude
          }),
          () => resolve({ lat: null, lon: null, text: "Location permission denied" })
        );
      });
    }

    async function getAddress(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
        const data = await res.json();
        return data.display_name || null;
      } catch (err) {
        return null;
      }
    }

    async function getMapThumbnail(lat, lon) {
      try {
        const url = `https://staticmap.openstreetmap.de/staticmap.php?center=${lat},${lon}&zoom=16&size=200x200&maptype=mapnik&markers=${lat},${lon},red-pushpin`;
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      } catch (err) {
        return null;
      }
    }

    function loadImageToCanvas(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = (height * maxWidth) / width;
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve({ canvas, ctx, width, height });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function buildGeotaggedPdf(file, lat, lon, address, mapDataUrl, maxWidth, quality) {
      const { canvas, ctx, width, height } = await loadImageToCanvas(file, maxWidth);

      const now = new Date();
      const lines = [];
      lines.push(address ? address : (lat !== null ? "Address unavailable" : "Location unavailable"));
      if (lat !== null && lon !== null) {
        lines.push(`Lat ${lat.toFixed(6)}, Long ${lon.toFixed(6)}`);
      }
      lines.push(now.toLocaleString());

      const fontSize = Math.max(13, Math.round(width * 0.022));
      ctx.font = fontSize + "px Arial";
      const lineHeight = fontSize + 4;
      const padding = 8;
      let maxLineWidth = 0;
      lines.forEach(line => {
        const w = ctx.measureText(line).width;
        if (w > maxLineWidth) maxLineWidth = w;
      });
      const boxHeight = lines.length * lineHeight + padding * 2;

      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, height - boxHeight, maxLineWidth + padding * 2, boxHeight);

      ctx.fillStyle = "white";
      lines.forEach((line, i) => {
        ctx.fillText(line, padding, height - boxHeight + padding + fontSize + i * lineHeight - 4);
      });

      const dataUrl = canvas.toDataURL('image/jpeg', quality);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = (height * pageWidth) / width;
      pdf.addImage(dataUrl, 'JPEG', 0, 0, pageWidth, pageHeight);

      if (mapDataUrl) {
        const thumbSize = 30;
        pdf.addImage(mapDataUrl, 'PNG', pageWidth - thumbSize - 5, 5, thumbSize, thumbSize);
      }

      return pdf.output('blob');
    }

    async function buildDocumentPdf(file, maxWidth, quality) {
      const { canvas, width, height } = await loadImageToCanvas(file, maxWidth);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = (height * pageWidth) / width;
      pdf.addImage(dataUrl, 'JPEG', 0, 0, pageWidth, pageHeight);

      return pdf.output('blob');
    }

    init();
  </script>
</body>
</html>
