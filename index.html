<!DOCTYPE html>
<html>
<head>
  <title>RKM Patient App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>RKM Patient Photo Tracking App</h1>

  <div id="login-box">
    <h2>Staff Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <div id="list-box" style="display:none;">
    <h2>Patients</h2>
    <button onclick="toggleAddForm()">+ Add New Patient</button>
    <input type="text" id="searchInput" placeholder="Filter by name or MRD" onkeyup="filterList()"><br><br>

    <div id="addForm" style="display:none; border:1px solid #999; padding:10px; margin:10px 0;">
      <h3>New Patient</h3>
      <input type="text" id="newMrd" placeholder="MRD / Registration ID"><br><br>
      <input type="text" id="newName" placeholder="Patient Name"><br><br>
      <input type="text" id="newWard" placeholder="Ward"><br><br>
      <input type="text" id="newBed" placeholder="Bed No."><br><br>
      <input type="date" id="newAdmissionDate"><br><br>
      <select id="newCategory">
      <option value="General">General</option>
      <option value="OT">OT</option>
      <option value="Dialysis">Dialysis</option>
     <option value="Chemo">Chemo</option>
</select><br><br>
      <button onclick="addPatient()">Save Patient</button>
      <p id="addMessage"></p>
    </div>

    <div id="patientList"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allPatients = [];

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      const messageBox = document.getElementById('message');
      if (error) {
        messageBox.innerText = "Login failed: " + error.message;
      } else {
        document.getElementById('login-box').style.display = "none";
        document.getElementById('list-box').style.display = "block";
        loadPatients();
      }
    }

    function toggleAddForm() {
      const form = document.getElementById('addForm');
      form.style.display = form.style.display === "none" ? "block" : "none";
    }

    async function addPatient() {
      const mrd = document.getElementById('newMrd').value;
      const name = document.getElementById('newName').value;
      const ward = document.getElementById('newWard').value;
      const bed_no = document.getElementById('newBed').value;
      const admission_date = document.getElementById('newAdmissionDate').value;
      const patient_category = document.getElementById('newCategory').value;
      const addMessage = document.getElementById('addMessage');

      if (!mrd || !name) {
        addMessage.innerText = "MRD and Name are required.";
        return;
      }

      const { error } = await supabaseClient
        .from('Patients')
        .insert([{ mrd, name, ward, bed_no, admission_date, patient_category, is_discharged: false }]);

      if (error) {
        addMessage.innerText = "Error: " + error.message;
      } else {
        addMessage.innerText = "Patient added!";
        document.getElementById('newMrd').value = "";
        document.getElementById('newName').value = "";
        document.getElementById('newWard').value = "";
        document.getElementById('newBed').value = "";
        document.getElementById('newAdmissionDate').value = "";
        loadPatients();
      }
    }

    async function loadPatients() {
      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .order('name', { ascending: true });

      if (!error && data) {
        allPatients = data;
        renderList(allPatients);
      }
    }

    function renderList(patients) {
      const listDiv = document.getElementById('patientList');
      if (patients.length === 0) {
        listDiv.innerHTML = "<p>No patients found.</p>";
        return;
      }
            listDiv.innerHTML = patients.map(p => `
        <a href="patient.html?mrd=${p.mrd}" style="text-decoration:none; color:black;">
          <div style="border:1px solid #ccc; padding:10px; margin:8px 0;">
            <strong>${p.name}</strong> (MRD: ${p.mrd})<br>
            Ward: ${p.ward} | Bed: ${p.bed_no}<br>
            Category: ${p.patient_category || "-"}<br>
            Status: ${p.is_discharged ? "Discharged" : "Active"}
          </div>
        </a>
      `).join('');
    }

    function filterList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allPatients.filter(p =>
        p.name.toLowerCase().includes(query) || p.mrd.toLowerCase().includes(query)
      );
      renderList(filtered);
    }
  </script>
</body>
</html>
