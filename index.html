<!DOCTYPE html>
<html>
<head>
  <title>RKM Patient App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>RKM Patient Photo Tracking App</h1>

  <div id="login-box">
    <h2>Staff Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <div id="list-box" style="display:none;">
    <h2>Patients</h2>
    <input type="text" id="searchInput" placeholder="Filter by name or MRD" onkeyup="filterList()">
    <div id="patientList"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allPatients = [];

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      const messageBox = document.getElementById('message');
      if (error) {
        messageBox.innerText = "Login failed: " + error.message;
      } else {
        document.getElementById('login-box').style.display = "none";
        document.getElementById('list-box').style.display = "block";
        loadPatients();
      }
    }

    async function loadPatients() {
      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .order('name', { ascending: true });

      if (!error && data) {
        allPatients = data;
        renderList(allPatients);
      }
    }

    function renderList(patients) {
      const listDiv = document.getElementById('patientList');
      if (patients.length === 0) {
        listDiv.innerHTML = "<p>No patients found.</p>";
        return;
      }
      listDiv.innerHTML = patients.map(p => `
        <div style="border:1px solid #ccc; padding:10px; margin:8px 0;">
          <strong>${p.name}</strong> (MRD: ${p.mrd})<br>
          Ward: ${p.ward} | Bed: ${p.bed_no}<br>
          Status: ${p.is_discharged ? "Discharged" : "Active"}
        </div>
      `).join('');
    }

    function filterList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allPatients.filter(p =>
        p.name.toLowerCase().includes(query) || p.mrd.toLowerCase().includes(query)
      );
      renderList(filtered);
    }
  </script>
</body>
</html>
