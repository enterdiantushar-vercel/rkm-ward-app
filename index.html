<!DOCTYPE html>
<html>
<head>
<title>RKM ABY MANAGEMENT - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>RKM ABY MANAGEMENT</h1>

  <div id="login-box">
    <h2>Staff Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      const messageBox = document.getElementById('message');
      if (error) {
        messageBox.innerText = "Login failed: " + error.message;
      } else {
        messageBox.innerText = "Login successful! Welcome, " + data.user.email;
      }
    }
  </script>
</body>
</html>
