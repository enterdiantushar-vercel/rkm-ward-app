<!DOCTYPE html>
<html>
<head>
  <title>RKM Patient App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>RKM Patient Photo Tracking App</h1>

  <div id="login-box">
    <h2>Staff Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <div id="search-box" style="display:none;">
    <h2>Search Patient</h2>
    <input type="text" id="searchInput" placeholder="Enter MRD / Registration ID">
    <button onclick="searchPatient()">Search</button>
    <div id="patientResult"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      const messageBox = document.getElementById('message');
      if (error) {
        messageBox.innerText = "Login failed: " + error.message;
      } else {
        messageBox.innerText = "Login successful! Welcome, " + data.user.email;
        document.getElementById('login-box').style.display = "none";
        document.getElementById('search-box').style.display = "block";
      }
    }

    async function searchPatient() {
      const mrd = document.getElementById('searchInput').value;
      const resultBox = document.getElementById('patientResult');

      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .eq('mrd', mrd)
        .single();

      if (error || !data) {
        resultBox.innerHTML = "<p>No patient found with that ID.</p>";
      } else {
        resultBox.innerHTML = `
          <h3>${data.name}</h3>
          <p>MRD: ${data.mrd}</p>
          <p>Ward: ${data.ward}</p>
          <p>Bed No: ${data.bed_no}</p>
          <p>Admission Date: ${data.admission_date}</p>
          <p>Category: ${data.patient_category}</p>
          <p>Status: ${data.is_discharged ? "Discharged" : "Active"}</p>
        `;
      }
    }
  </script>
</body>
</html>
