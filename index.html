<!DOCTYPE html>
<html>
<head>
  <title>RKM Patient App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>RKM Patient Photo Tracking App</h1>

  <div id="login-box">
    <h2>Staff Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <div id="list-box" style="display:none;">
    <h2>Patients</h2>
           <button onclick="toggleAddForm()">+ Add New Patient</button>
    <input type="text" id="searchInput" placeholder="Filter by name or MRD" onkeyup="filterList()"><br><br>
            <div style="margin: 10px 0;">
  <button onclick="toggleFilters()" type="button">Filters ▾</button>
  <div id="filterPanel" style="display:none; border:1px solid #999; padding:10px; margin-top:5px; max-width:400px;">
    <strong>Filter by Ward:</strong><br>
    <div id="wardCheckboxes">
      <label><input type="checkbox" value="A1" onchange="filterList()"> A1</label>
      <label><input type="checkbox" value="A2" onchange="filterList()"> A2</label>
      <label><input type="checkbox" value="A3" onchange="filterList()"> A3</label>
      <label><input type="checkbox" value="B1" onchange="filterList()"> B1</label>
      <label><input type="checkbox" value="B2" onchange="filterList()"> B2</label>
      <label><input type="checkbox" value="B3" onchange="filterList()"> B3</label>
      <label><input type="checkbox" value="C2" onchange="filterList()"> C2</label>
      <label><input type="checkbox" value="C3" onchange="filterList()"> C3</label>
      <label><input type="checkbox" value="C5" onchange="filterList()"> C5</label>
      <label><input type="checkbox" value="PWM" onchange="filterList()"> PWM</label>
      <label><input type="checkbox" value="PWS" onchange="filterList()"> PWS</label>
      <label><input type="checkbox" value="GE" onchange="filterList()"> GE</label>
      <label><input type="checkbox" value="CW" onchange="filterList()"> CW</label>
      <label><input type="checkbox" value="EXT CW" onchange="filterList()"> EXT CW</label>
      <label><input type="checkbox" value="CCU" onchange="filterList()"> CCU</label>
      <label><input type="checkbox" value="ICU" onchange="filterList()"> ICU</label>
      <label><input type="checkbox" value="HDUII" onchange="filterList()"> HDUII</label>
    </div>

    <strong>Filter by Category:</strong><br>
    <div id="categoryCheckboxes">
      <label><input type="checkbox" value="Medicine" onchange="filterList()"> Medicine</label>
      <label><input type="checkbox" value="OT" onchange="filterList()"> OT</label>
      <label><input type="checkbox" value="Dialysis" onchange="filterList()"> Dialysis</label>
      <label><input type="checkbox" value="Chemo" onchange="filterList()"> Chemo</label>
    </div>

    <button onclick="clearFilters()">Clear Filters</button>
  </div>
</div>
    <div id="addForm" style="display:none; border:1px solid #999; padding:10px; margin:10px 0;">
      <h3>New Patient</h3>
      <input type="text" id="newMrd" placeholder="MRD / Registration ID"><br><br>
      <input type="text" id="newName" placeholder="Patient Name"><br><br>
      <select id="newWard">
  <option value="">Select Ward</option>
  <option value="A1">A1</option>
  <option value="A2">A2</option>
  <option value="A3">A3</option>
  <option value="B1">B1</option>
  <option value="B2">B2</option>
  <option value="B3">B3</option>
  <option value="C2">C2</option>
  <option value="C3">C3</option>
  <option value="C5">C5</option>
  <option value="PWM">PWM</option>
  <option value="PWS">PWS</option>
  <option value="GE">GE</option>
  <option value="CW">CW</option>
  <option value="EXT CW">EXT CW</option>
  <option value="CCU">CCU</option>
  <option value="ICU">ICU</option>
  <option value="HDUII">HDUII</option>
</select><br><br>
      <input type="text" id="newBed" placeholder="Bed No."><br><br>
      <input type="date" id="newAdmissionDate"><br><br>
      <select id="newCategory">
      <option value="Medicine">Medicine</option>
      <option value="OT">OT</option>
      <option value="Dialysis">Dialysis</option>
     <option value="Chemo">Chemo</option>
</select><br><br>
      <button onclick="addPatient()">Save Patient</button>
      <p id="addMessage"></p>
    </div>

    <div id="patientList"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let allPatients = [];
    let allPhotosToday = [];

    const REQUIRED_SLOTS = {
      "Medicine": ["Patient Photo", "IPD Chart", "Drug Chart", "TPRB Chart"],
      "OT": ["Before Procedure", "During Procedure", "After Procedure"],
      "Dialysis": ["Before Procedure", "During Procedure", "After Procedure"],
      "Chemo": ["Before Procedure", "During Procedure", "After Procedure"]
    };

    async function checkSession() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (sessionData.session) {
        document.getElementById('login-box').style.display = "none";
        document.getElementById('list-box').style.display = "block";
        loadPatients();
      }
    }
    checkSession();

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      const messageBox = document.getElementById('message');
      if (error) {
        messageBox.innerText = "Login failed: " + error.message;
      } else {
        document.getElementById('login-box').style.display = "none";
        document.getElementById('list-box').style.display = "block";
        loadPatients();
      }
    }

    function toggleAddForm() {
      const form = document.getElementById('addForm');
      form.style.display = form.style.display === "none" ? "block" : "none";
    }

    async function addPatient() {
      const mrd = document.getElementById('newMrd').value;
      const name = document.getElementById('newName').value;
      const ward = document.getElementById('newWard').value;
      const bed_no = document.getElementById('newBed').value;
      const admission_date = document.getElementById('newAdmissionDate').value;
      const patient_category = document.getElementById('newCategory').value;
      const addMessage = document.getElementById('addMessage');

      if (!mrd || !name) {
        addMessage.innerText = "MRD and Name are required.";
        return;
      }

      const { error } = await supabaseClient
        .from('Patients')
        .insert([{ mrd, name, ward, bed_no, admission_date, patient_category, is_discharged: false }]);

      if (error) {
        addMessage.innerText = "Error: " + error.message;
      } else {
        addMessage.innerText = "Patient added!";
        document.getElementById('newMrd').value = "";
        document.getElementById('newName').value = "";
        document.getElementById('newWard').value = "";
        document.getElementById('newBed').value = "";
        document.getElementById('newAdmissionDate').value = "";
        loadPatients();
      }
    }

    async function loadPatients() {
      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .order('name', { ascending: true });

      if (!error && data) {
        allPatients = data;
        renderList(allPatients);
      }
    }

    function renderList(patients) {
      const listDiv = document.getElementById('patientList');
      if (patients.length === 0) {
        listDiv.innerHTML = "<p>No patients found.</p>";
        return;
      }
            listDiv.innerHTML = patients.map(p => `
        <a href="patient.html?mrd=${p.mrd}" style="text-decoration:none; color:black;">
          <div style="border:1px solid #ccc; padding:10px; margin:8px 0;">
            <strong>${p.name}</strong> (MRD: ${p.mrd})<br>
            Ward: ${p.ward} | Bed: ${p.bed_no}<br>
            Category: ${p.patient_category || "-"}<br>
            Status: ${p.is_discharged ? "Discharged" : "Active"}
          </div>
        </a>
      `).join('');
    }
        function toggleFilters() {
      const panel = document.getElementById('filterPanel');
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    }

       function filterList() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const selectedWards = Array.from(document.querySelectorAll('#wardCheckboxes input:checked')).map(cb => cb.value);
      const selectedCategories = Array.from(document.querySelectorAll('#categoryCheckboxes input:checked')).map(cb => cb.value);

      const filtered = allPatients.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(query) || p.mrd.toLowerCase().includes(query);
        const matchesWard = selectedWards.length === 0 || selectedWards.includes(p.ward);
        const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(p.patient_category);
        return matchesSearch && matchesWard && matchesCategory;
      });

      renderList(filtered);
    }

function clearFilters() {
  document.getElementById('searchInput').value = "";
  document.querySelectorAll('#wardCheckboxes input, #categoryCheckboxes input').forEach(cb => cb.checked = false);
  filterList();
}
  </script>
</body>
</html>
