<!DOCTYPE html>
<html>
<head>
    <title>RKMSP Patient Data Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4DB6AC">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --teal-primary: #4DB6AC;
      --teal-active: #26A69A;
      --sky-blue: #42A5F5;
      --sky-blue-dark: #2196F3;
      --bg-page: #F0FAF9;
      --card-bg: #FFFFFF;
      --text-primary: #263238;
      --text-secondary: #607D8B;
      --success: #43A047;
      --warning: #FFB300;
      --danger: #E53935;
      --border-light: #DCEFED;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    .header {
      background: var(--teal-primary);
      color: white;
      padding: 14px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 1px 6px rgba(38,50,56,0.12);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand img {
      height: 100px;
      width: auto;
      display: block;
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 3px 5px;
    }
    .header h1 {
      margin: 0;
      font-size: clamp(15px, 3.6vw, 21px);
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header button {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
    }
    .header button:hover { background: rgba(255,255,255,0.28); }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 4vw;
    }
    #login-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 7vw 6vw;
      margin-top: 48px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 20px rgba(38,50,56,0.08);
      border-top: 4px solid var(--teal-primary);
    }
    #login-box h2 { margin-top: 0; color: var(--text-primary); }
    label, strong { color: var(--text-primary); }
    input[type="email"], input[type="password"], input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px 0;
      border: 1px solid #D3E7E5;
      border-radius: 8px;
      font-size: 16px;
      min-height: 44px;
      background: #FBFEFE;
      color: var(--text-primary);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--teal-active);
      box-shadow: 0 0 0 3px rgba(38,166,154,0.15);
    }
    button {
      background: var(--sky-blue);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--sky-blue-dark); }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--teal-active);
      border: 1.5px solid #B9E4E0;
    }
    .btn-secondary:hover { background: #E8F7F5; }
    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .top-actions input[type="text"] {
      flex: 1 1 200px;
      margin: 0;
    }
    #filterPanel {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      border: 1px solid var(--border-light);
    }
    .filter-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip-group label {
      display: inline-flex;
      align-items: center;
      padding: 7px 13px;
      margin: 0;
      border-radius: 20px;
      border: 1.5px solid #D3E7E5;
      background: #FBFEFE;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      user-select: none;
    }
    .chip-group label.active {
      background: var(--teal-active);
      border-color: var(--teal-active);
      color: white;
      font-weight: 600;
    }
    .chip-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      accent-color: var(--teal-active);
    }
    #addForm {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      max-width: 480px;
      border: 1px solid var(--border-light);
    }
    #addForm h3 { margin-top: 0; color: var(--text-primary); }
    #patientList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .patient-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      border-left: 5px solid #CFE3E1;
      text-decoration: none;
      color: var(--text-primary);
      display: block;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .patient-card:hover {
      box-shadow: 0 4px 14px rgba(38,50,56,0.12);
      transform: translateY(-1px);
    }
    .patient-card.complete { border-left-color: var(--success); background: #F4FBF3; }
    .patient-card.incomplete { border-left-color: var(--warning); background: #FFFCF2; }
    .patient-name { font-size: clamp(15px, 3vw, 17px); font-weight: 600; word-break: break-word; }
    .patient-meta { font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
    .status-line { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .status-complete { color: var(--success); }
    .status-incomplete { color: #B8860B; }

    @media (min-width: 600px) {
      .container { padding: 24px; }
      #patientList { grid-template-columns: repeat(2, 1fr); }
      #addForm { padding: 20px; }
    }

    @media (min-width: 1024px) {
      .header { padding: 16px 40px; }
      .container { padding: 32px 40px; }
      #patientList { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <span style="font-size:18px; font-weight:600;">RKMSP Patient Data Manager</span>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div id="app" style="display:none;">
      <div class="top-actions">
        <input type="text" id="searchInput" placeholder="Search name or MRD..." oninput="filterList()">
        <button onclick="document.getElementById('filterPanel').style.display = document.getElementById('filterPanel').style.display === 'none' ? 'block' : 'none'">Filters <span id="filterCountBadge"></span></button>
        <button class="btn-secondary" onclick="clearFilters()">Clear</button>
        <button onclick="document.getElementById('addForm').style.display = document.getElementById('addForm').style.display === 'none' ? 'block' : 'none'">+ Add Patient</button>
        <button class="btn-secondary" onclick="downloadActiveCsv()">Download Active List (Ward-wise)</button>
        <a href="enhancement.html"><button class="btn-secondary">Enhancement Tracker</button></a>
      </div>

      <div id="filterPanel" style="display:none;">
        <div class="filter-section-title" onclick="toggleChipGroup('wardCheckboxes','wardChevron')">Ward <span id="wardChevron">&#9662;</span></div>
        <div id="wardCheckboxes" class="chip-group" style="display:flex; margin-bottom:12px;"></div>

        <div class="filter-section-title" onclick="toggleChipGroup('categoryCheckboxes','categoryChevron')">Category <span id="categoryChevron">&#9662;</span></div>
        <div id="categoryCheckboxes" class="chip-group" style="display:flex; margin-bottom:12px;"></div>

        <div class="filter-section-title" onclick="toggleChipGroup('unitCheckboxes','unitChevron')">Doctor Unit <span id="unitChevron">&#9662;</span></div>
        <div id="unitCheckboxes" class="chip-group" style="display:flex;"></div>
      </div>

      <div id="addForm" style="display:none;">
        <h3>Add New Patient</h3>
        <label>MRD *</label>
        <input type="text" id="newMrd" placeholder="MRD number">
        <label>PMJAY ID (optional)</label>
        <input type="text" id="newPmjayId" placeholder="PMJAY Registration ID">
        <label>Patient Name *</label>
        <input type="text" id="newName" placeholder="Full name">
        <label>Ward</label>
        <select id="newWard">
          <option value="">Not assigned yet</option>
          <option>NICU 1</option><option>NICU 2</option><option>PICU</option><option>CW-CTVS</option><option>A2</option><option>A3</option>
          <option>B1</option><option>B2</option><option>B3</option>
          <option>C2</option><option>C3</option><option>C5</option>
          <option>PWM</option><option>PWS</option><option>GE</option>
          <option>CW</option><option>EXT CW</option><option>CCU</option>
          <option>ICU</option><option>HDUII</option>
        </select>
        <label>Bed No.</label>
        <input type="text" id="newBed" placeholder="Bed number">
        <label>Doctor Unit (optional)</label>
        <select id="newDoctorUnit">
          <option value="">Not assigned yet</option>
          <option value="UNIT1">UNIT1 - DR. PRADEEP CHAKRABORTY / DR. SUJATA MAZUMDER</option>
          <option value="UNIT2">UNIT2 - DR. SUJOY ROYCHOWDHURY / DR. PRABUDDHA MUKHOPADHYAY</option>
          <option value="UNIT3">UNIT3 - DR. BISWANATH PATRA / DR. SANDIPAN MUKHERJEE</option>
          <option value="UNIT4">UNIT4 - DR. AMITAVA MAZUMDER / DR. UJWAL CHAKRABORTY</option>
          <option value="UNIT5">UNIT5 - DR. TANMOY CHATTERJEE / DR. SHYAMOSHREE MONDAL</option>
          <option value="UNIT6">UNIT6 - DR. TAPAS LAHA / DR. BARUN GHORU</option>
        </select>
        <label>Admission Date</label>
        <input type="date" id="newAdmissionDate">
        <label>Category</label>
        <select id="newCategory" onchange="toggleLosField()">
          <option value="Medicine">Medicine</option>
          <option value="OT">OT</option>
          <option value="Dialysis">Dialysis</option>
          <option value="Chemo">Chemo</option>
        </select>
        <div id="newLosWrap" style="display:none;">
          <label>LOS days</label>
          <input type="number" id="newLos" min="1" placeholder="Length of stay">
        </div>
        <button onclick="addPatient()">Save Patient</button>
        <p id="addMessage" class="patient-meta"></p>
      </div>

      <p id="debugInfo" style="font-size:11px; color:#90A4AE;"></p>
      <div id="patientList">Loading...</div>
    </div>

    <div id="login-box">
      <h2>Staff Login</h2>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="login()">Login</button>
      <p id="loginMessage" style="color:var(--danger);"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const REQUIRED_SLOTS = {
      Medicine: ["Patient Photo", "IPD Chart", "Drug Chart", "TPRB Chart"],
      OT: ["Before Procedure", "During Procedure", "After Procedure"],
      Dialysis: ["Before Procedure", "During Procedure", "After Procedure"],
      Chemo: ["Before Procedure", "During Procedure", "After Procedure"]
    };

    const DOCTOR_UNITS = [
      { value: "UNIT1", label: "UNIT1" },
      { value: "UNIT2", label: "UNIT2" },
      { value: "UNIT3", label: "UNIT3" },
      { value: "UNIT4", label: "UNIT4" },
      { value: "UNIT5", label: "UNIT5" },
      { value: "UNIT6", label: "UNIT6" }
    ];

    let allPatients = [];
    let allPhotosToday = [];
    let currentUserEmail = "";
    let inactivityTimer;

    function startInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(async () => {
        await supabaseClient.auth.signOut();
        alert("You were logged out due to 30 minutes of inactivity.");
        window.location.reload();
      }, 30 * 60 * 1000);
    }
    ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt => {
      document.addEventListener(evt, startInactivityTimer);
    });

    async function logout() {
      clearTimeout(inactivityTimer);
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('loginMessage').innerText = error.message;
        return;
      }
      initApp();
    }

    async function initApp() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        document.getElementById('login-box').style.display = "block";
        document.getElementById('app').style.display = "none";
        return;
      }
      currentUserEmail = sessionData.session.user.email;
      document.getElementById('login-box').style.display = "none";
      document.getElementById('app').style.display = "block";
      startInactivityTimer();
      buildFilterChips();
      loadPatients();
    }

    function toggleLosField() {
      const cat = document.getElementById('newCategory').value;
      document.getElementById('newLosWrap').style.display = cat === "Medicine" ? "none" : "block";
    }

    function toggleChipGroup(groupId, chevronId) {
      const group = document.getElementById(groupId);
      const chevron = document.getElementById(chevronId);
      const isOpen = group.style.display === "flex" || group.style.display === "block";
      group.style.display = isOpen ? "none" : "flex";
      chevron.innerHTML = isOpen ? "&#9656;" : "&#9662;";
    }

    function syncChipHighlights() {
      document.querySelectorAll('.chip-group input[type="checkbox"]').forEach(cb => {
        cb.closest('label').classList.toggle('active', cb.checked);
      });
    }

    function buildFilterChips() {
      // Wards
      const wards = ["NICU 1","NICU 2","PICU","CW-CTVS","A2","A3","B1","B2","B3","C2","C3","C5","PWM","PWS","GE","CW","EXT CW","CCU","ICU","HDUII"];
      document.getElementById('wardCheckboxes').innerHTML = wards.map(w =>
        `<label><input type="checkbox" value="${w}" onchange="filterList()"> ${w}</label>`
      ).join('');

      // Categories
      const cats = ["Medicine","OT","Dialysis","Chemo"];
      document.getElementById('categoryCheckboxes').innerHTML = cats.map(c =>
        `<label><input type="checkbox" value="${c}" onchange="filterList()"> ${c}</label>`
      ).join('');

      // Doctor Units
      document.getElementById('unitCheckboxes').innerHTML = DOCTOR_UNITS.map(u =>
        `<label><input type="checkbox" value="${u.value}" onchange="filterList()"> ${u.label}</label>`
      ).join('') + `<label><input type="checkbox" value="__none__" onchange="filterList()"> Not assigned</label>`;
    }

    async function addPatient() {
      const mrd = document.getElementById('newMrd').value.trim();
      const pmjay_id = document.getElementById('newPmjayId').value.trim() || null;
      const name = document.getElementById('newName').value.trim();
      const ward = document.getElementById('newWard').value;
      const bed_no = document.getElementById('newBed').value.trim();
      const doctor_unit = document.getElementById('newDoctorUnit').value || null;
      const admission_date = document.getElementById('newAdmissionDate').value;
      const patient_category = document.getElementById('newCategory').value;
      const los_raw = document.getElementById('newLos').value;
      const los_days = (patient_category !== "Medicine" && los_raw) ? parseInt(los_raw) : null;
      const addMessage = document.getElementById('addMessage');

      if (!mrd || !name) {
        addMessage.innerText = "MRD and Name are required.";
        return;
      }

      const { error } = await supabaseClient
        .from('Patients')
        .insert([{ mrd, name, ward, bed_no, doctor_unit, admission_date, patient_category, pmjay_id, los_days, los_start_date: los_days ? admission_date : null, is_discharged: false }]);

      if (error) {
        addMessage.innerText = "Error: " + error.message;
      } else {
        addMessage.innerText = "Patient added!";
        document.getElementById('newMrd').value = "";
        document.getElementById('newPmjayId').value = "";
        document.getElementById('newName').value = "";
        document.getElementById('newWard').value = "";
        document.getElementById('newBed').value = "";
        document.getElementById('newDoctorUnit').value = "";
        document.getElementById('newAdmissionDate').value = "";
        loadPatients();
      }
    }

    async function loadPatients() {
      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .order('name', { ascending: true });

      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });

      const activeMrds = (data || []).filter(p => !p.is_discharged).map(p => p.mrd);
      const { data: photoData, error: photoError } = activeMrds.length
        ? await supabaseClient
            .from('daily_photos')
            .select('mrd, photo_type, photo_date, uploaded_at')
            .in('mrd', activeMrds)
        : { data: [], error: null };

      if (!photoError && photoData) {
        allPhotosToday = photoData;
      }

      if (!error && data) {
        // Active patients first, discharged at the bottom. Within each group sort by name.
        allPatients = data.slice().sort((a, b) => {
          const aDischarged = a.is_discharged ? 1 : 0;
          const bDischarged = b.is_discharged ? 1 : 0;
          if (aDischarged !== bDischarged) return aDischarged - bDischarged;
          return (a.name || "").localeCompare(b.name || "");
        });
        renderList(allPatients);
      } else {
        document.getElementById('patientList').innerHTML =
          "<p>Error loading patients" + (error ? ": " + error.message : ".") + "</p>";
      }
    }

    function getPatientStatus(p) {
      if (p.is_discharged) return null;
      if (allPhotosToday.some(ph => ph.mrd === p.mrd && ph.photo_type === "Discharge Photo")) return null;

      const required = REQUIRED_SLOTS[p.patient_category] || [];
      const isDaily = p.patient_category === "Medicine";
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });

      const patientPhotos = allPhotosToday.filter(ph => ph.mrd === p.mrd);

      const relevantPhotos = isDaily
        ? patientPhotos.filter(ph => {
            if (!ph.uploaded_at) return false;
            let s = ph.uploaded_at;
            if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
            const d = new Date(s).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
            return d === today;
          })
        : patientPhotos;

      const capturedTypes = new Set(relevantPhotos.map(ph => ph.photo_type));
      const missing = required.filter(slot => !capturedTypes.has(slot));

      return {
        done: required.length - missing.length,
        total: required.length,
        missing,
        isDaily
      };
    }

    function dischargeHtml(p) {
      if (p.is_discharged) return "";
      const dp = allPhotosToday
        .filter(ph => ph.mrd === p.mrd && ph.photo_type === "Discharge Photo")
        .sort((a, b) => (a.uploaded_at < b.uploaded_at ? 1 : -1))[0];
      if (!dp) return "";
      let dateText = "";
      if (dp.uploaded_at) {
        let s = dp.uploaded_at;
        if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
        dateText = " on " + new Date(s).toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
      }
      return `<div class="status-line status-complete">&#10003; Discharge photo captured${dateText}</div>`;
    }

    function losHtml(p) {
      if (p.is_discharged || !p.los_days || p.patient_category === "Medicine" || !p.admission_date) return "";
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      const losStart = p.los_start_date || p.admission_date;
      const dayNo = Math.round((new Date(today) - new Date(losStart)) / 86400000) + 1;
      const left = p.los_days - dayNo;
      if (left < 0) return `<div class="status-line" style="color:#E53935;">&#9888; LOS EXCEEDED by ${-left} day(s). Discharge and readmit on paper.</div>`;
      if (left === 0) return `<div class="status-line" style="color:#B8860B;">&#9888; LOS ends today (Day ${dayNo} of ${p.los_days})</div>`;
      return `<div class="status-line" style="color:#607D8B;">LOS: Day ${dayNo} of ${p.los_days}</div>`;
    }

    function renderList(patients) {
      const listDiv = document.getElementById('patientList');
      if (patients.length === 0) {
        listDiv.innerHTML = "<p>No patients found.</p>";
        return;
      }
      listDiv.innerHTML = patients.map(p => {
        const status = getPatientStatus(p);
        let trackingHtml = "";
        let cardClass = "";
        if (status) {
          const label = status.isDaily ? "today" : "overall";
          if (status.missing.length === 0) {
            trackingHtml = `<div class="status-line status-complete">${status.done}/${status.total} done ${label} — All complete</div>`;
            cardClass = "complete";
          } else {
            trackingHtml = `<div class="status-line status-incomplete">${status.done}/${status.total} done ${label} — Missing: ${status.missing.join(", ")}</div>`;
            cardClass = "incomplete";
          }
        }

        const unitText = p.doctor_unit ? p.doctor_unit : "Not assigned";

        return `
          <a href="patient.html?mrd=${p.mrd}" class="patient-card ${cardClass}">
            <div class="patient-name">${p.name} <span style="font-weight:400; color:#777;">(MRD: ${p.mrd} | PMJAY: ${p.pmjay_id || "-"})</span></div>
            <div class="patient-meta">Ward: ${p.ward || "Not assigned"} | Bed: ${p.bed_no || "Not assigned"} | Unit: ${unitText} | ${p.patient_category || "-"} | ${p.is_discharged ? "Discharged" : "Active"}</div>
            ${trackingHtml}${dischargeHtml(p)}${losHtml(p)}
          </a>
        `;
      }).join('');
    }

    function filterList() {
      syncChipHighlights();
      const query = document.getElementById('searchInput').value.toLowerCase();

      const selectedWards = Array.from(document.querySelectorAll('#wardCheckboxes input:checked')).map(cb => cb.value);
      const selectedCategories = Array.from(document.querySelectorAll('#categoryCheckboxes input:checked')).map(cb => cb.value);
      const selectedUnits = Array.from(document.querySelectorAll('#unitCheckboxes input:checked')).map(cb => cb.value);

      const activeCount = selectedWards.length + selectedCategories.length + selectedUnits.length;
      const badge = document.getElementById('filterCountBadge');
      if (badge) badge.innerText = activeCount > 0 ? '(' + activeCount + ')' : '';

      const filtered = allPatients.filter(p => {
        const matchesSearch = (p.name || "").toLowerCase().includes(query) || (p.mrd || "").toLowerCase().includes(query);
        const matchesWard = selectedWards.length === 0 || selectedWards.includes(p.ward);
        const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(p.patient_category);
        let matchesUnit = true;
        if (selectedUnits.length > 0) {
          const hasNone = selectedUnits.includes("__none__");
          const realUnits = selectedUnits.filter(u => u !== "__none__");
          matchesUnit = (hasNone && !p.doctor_unit) || realUnits.includes(p.doctor_unit);
        }
        return matchesSearch && matchesWard && matchesCategory && matchesUnit;
      });

      renderList(filtered);
    }

    function clearFilters() {
      document.getElementById('searchInput').value = "";
      document.querySelectorAll('#wardCheckboxes input, #categoryCheckboxes input, #unitCheckboxes input').forEach(cb => cb.checked = false);
      syncChipHighlights();
      filterList();
    }

    function downloadActiveCsv() {
      const active = allPatients.filter(p => !p.is_discharged);
      if (active.length === 0) {
        alert("No active patients to download.");
        return;
      }

      // Sort ward-wise, then by name
      const sorted = active.slice().sort((a, b) => {
        const w = (a.ward || "").localeCompare(b.ward || "");
        if (w !== 0) return w;
        return (a.name || "").localeCompare(b.name || "");
      });

      const header = ["Ward", "Bed", "MRD", "Name", "PMJAY", "Doctor Unit", "Category", "Admission Date"];
      const rows = sorted.map(p => [
        p.ward || "",
        p.bed_no || "",
        p.mrd || "",
        p.name || "",
        p.pmjay_id || "",
        p.doctor_unit || "",
        p.patient_category || "",
        p.admission_date || ""
      ].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","));

      const csv = [header.join(",")].concat(rows).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "active-patients-wardwise-" + new Date().toISOString().slice(0,10) + ".csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Check session on load
    initApp();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
