<!DOCTYPE html>
<html>
<head>
    <title>Enhancement Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4DB6AC">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --teal-primary: #4DB6AC;
      --teal-active: #26A69A;
      --sky-blue: #42A5F5;
      --sky-blue-dark: #2196F3;
      --bg-page: #F0FAF9;
      --card-bg: #FFFFFF;
      --text-primary: #263238;
      --text-secondary: #607D8B;
      --success: #43A047;
      --warning: #FFB300;
      --danger: #E53935;
      --border-light: #DCEFED;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .header {
      background: var(--teal-primary);
      color: white;
      padding: 14px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header a { color: white; text-decoration: none; font-size: 14px; }
    .header h1 { margin: 4px 0 0 0; font-size: clamp(17px, 4vw, 21px); }
    .header button {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 4vw; }
    button {
      background: var(--sky-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      min-height: 40px;
    }
    button:hover { background: var(--sky-blue-dark); }
    .patient-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      border-left: 5px solid #ccc;
    }
    .patient-card.overdue { border-left-color: var(--danger); background: #FDF3F2; }
    .patient-card.ok { border-left-color: var(--success); background: #F4FBF3; }
    .patient-card.never { border-left-color: var(--warning); background: #FFFCF2; }
    .patient-name { font-weight: 600; font-size: 15px; }
    .patient-meta { font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
    .status-badge { font-size: 13px; font-weight: 600; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <a href="index.html">&larr; Back to list</a>
      <h1>Enhancement Tracker</h1>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <p id="summary"></p>
    <div id="list">Loading...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://drsvjggsrpibkczldahl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PCV_XmzEIUoX08BCQqK9HA_0MZ4XI_H";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserEmail = "";
    let inactivityTimer;

    function parseUTC(dateStr) {
      if (!dateStr) return new Date();
      if (!dateStr.endsWith('Z') && !dateStr.includes('+')) {
        dateStr = dateStr + 'Z';
      }
      return new Date(dateStr);
    }

    function startInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(async () => {
        await supabaseClient.auth.signOut();
        alert("You were logged out due to 30 minutes of inactivity.");
        window.location.href = "index.html";
      }, 30 * 60 * 1000);
    }
    ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt => {
      document.addEventListener(evt, startInactivityTimer);
    });

    async function logout() {
      clearTimeout(inactivityTimer);
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "index.html";
        return;
      }
      currentUserEmail = sessionData.session.user.email;
      startInactivityTimer();
      loadTracker();
    }

    async function loadTracker() {
      const { data: patients, error: pErr } = await supabaseClient
        .from('Patients')
        .select('*')
        .eq('is_discharged', false);

      const { data: logs, error: lErr } = await supabaseClient
        .from('enhancement_log')
        .select('*')
        .order('marked_at', { ascending: true });

      if (pErr || lErr || !patients) {
        document.getElementById('list').innerText = "Error loading tracker.";
        return;
      }

      const now = new Date();
      const results = patients.map(p => {
        const patientLogs = logs.filter(l => l.mrd === p.mrd);
        const lastLog = patientLogs.length > 0 ? patientLogs[patientLogs.length - 1] : null;

        let status, nextDueText, lastText;
        if (!lastLog) {
          status = "never";
          lastText = "Never enhanced";
          nextDueText = "Due now";
        } else {
          const lastTime = parseUTC(lastLog.marked_at);
          const nextDue = new Date(lastTime.getTime() + 48 * 60 * 60 * 1000);
         lastText = "Last: " + lastTime.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' }) + " by " + lastLog.marked_by;
          nextDueText = "Next due: " + nextDue.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' });
          status = nextDue <= now ? "overdue" : "ok";
        }
        return { patient: p, status, lastText, nextDueText };
      });

      const order = { never: 0, overdue: 1, ok: 2 };
      results.sort((a, b) => order[a.status] - order[b.status]);

      const overdueCount = results.filter(r => r.status !== "ok").length;
      document.getElementById('summary').innerText =
        `${overdueCount} of ${results.length} patients need enhancement now.`;

            document.getElementById('list').innerHTML = results.map(r => {
        const p = r.patient;
        const badgeText = r.status === "ok" ? "Up to date" : (r.status === "never" ? "Never enhanced" : "Overdue");
        const buttonHtml = r.status === "ok"
          ? `<button disabled style="background:#B0BEC5; cursor:not-allowed;">Not due yet</button>`
          : `<button onclick="markEnhanced('${p.mrd}')">Mark Enhanced</button>`;
        return `
          <div class="patient-card ${r.status}">
            <div class="patient-name">${p.name} (MRD: ${p.mrd})</div>
            <div class="patient-meta">Ward: ${p.ward} | ${p.patient_category || "-"}</div>
            <div class="status-badge">${badgeText}</div>
            <div class="patient-meta">${r.lastText}</div>
            <div class="patient-meta">${r.nextDueText}</div>
            ${buttonHtml}
          </div>
        `;
      }).join('');
    }

    async function markEnhanced(mrd) {
      const { error } = await supabaseClient
        .from('enhancement_log')
        .insert([{ mrd: mrd, marked_by: currentUserEmail }]);

      if (error) {
        alert("Error: " + error.message);
        return;
      }
      loadTracker();
    }

        init();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
